name: Temporary July intraday analysis

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-intraday-analysis.yml
      - tmp_intraday_analysis.py
      - tmp_intraday_analysis_yahoo.py

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout temporary pull request
        uses: actions/checkout@v4
      - name: Run full-month analysis
        run: python tmp_intraday_analysis_yahoo.py
      - name: Upload temporary results
        uses: actions/upload-artifact@v4
        with:
          name: july-intraday-results-full-month
          path: |
            tmp_intraday_results.json
            tmp_intraday_results.md
          retention-days: 1
