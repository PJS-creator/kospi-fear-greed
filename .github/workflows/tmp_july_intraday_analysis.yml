name: Temporary July 2026 intraday analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install TradingView downloader
        run: |
          python -m pip install --quiet --upgrade pandas numpy websocket-client requests
          python -m pip install --quiet --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git

      - name: Fetch and aggregate TradingView intraday data
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          from collections import defaultdict
          from datetime import date, datetime, time as dtime

          import pandas as pd
          from tvDatafeed import TvDatafeed, Interval

          START_DATE = date(2026, 7, 1)
          END_DATE = date(2026, 7, 29)

          def finite(value):
              try:
                  value = float(value)
              except (TypeError, ValueError):
                  return None
              return value if math.isfinite(value) else None

          tv = TvDatafeed()
          assets = {
              "삼성전자": [("005930", "KRX")],
              "SK하이닉스": [("000660", "KRX")],
              "KOSPI200": [("KOSPI200", "KRX"), ("KS200", "KRX"), ("KPI200", "KRX"), ("KOSPI200", "TVC")],
          }

          raw_assets = {}
          errors = {}
          searches = {}

          for label, candidates in assets.items():
              candidate_errors = []
              frame = None
              chosen = None
              for symbol, exchange in candidates:
                  try:
                      df = tv.get_hist(
                          symbol=symbol,
                          exchange=exchange,
                          interval=Interval.in_5_minute,
                          n_bars=5000,
                          extended_session=False,
                      )
                      if df is None or df.empty:
                          raise RuntimeError("empty dataframe")
                      frame = df.copy()
                      chosen = {"symbol": symbol, "exchange": exchange}
                      break
                  except Exception as exc:
                      candidate_errors.append(f"{exchange}:{symbol}: {type(exc).__name__}: {exc}")
              if frame is None:
                  try:
                      searches[label] = tv.search_symbol("KOSPI200" if label == "KOSPI200" else candidates[0][0], "KRX")
                  except Exception as exc:
                      searches[label] = [f"search failed: {type(exc).__name__}: {exc}"]
                  errors[label] = candidate_errors
                  continue

              if candidate_errors:
                  errors[label] = candidate_errors
              raw_assets[label] = {"chosen": chosen, "frame": frame}

          def normalize_frame(df):
              out = []
              for idx, row in df.iterrows():
                  if isinstance(idx, pd.Timestamp):
                      ts = idx
                  else:
                      ts = pd.Timestamp(idx)
                  if ts.tzinfo is not None:
                      ts = ts.tz_convert("Asia/Seoul").tz_localize(None)
                  dt = ts.to_pydatetime()
                  if not (START_DATE <= dt.date() <= END_DATE):
                      continue
                  if not (dtime(9, 0) <= dt.time() <= dtime(15, 30)):
                      continue
                  o, h, l, c, v = (finite(row.get(k)) for k in ("open", "high", "low", "close", "volume"))
                  if None in (o, h, l, c):
                      continue
                  out.append({"dt": dt, "open": o, "high": h, "low": l, "close": c, "volume": max(v or 0.0, 0.0)})
              unique = {b["dt"]: b for b in out}
              return sorted(unique.values(), key=lambda b: b["dt"])

          def window_value(bars, start_t, end_t):
              selected = [b for b in bars if start_t <= b["dt"].time() < end_t]
              if not selected:
                  return None, 0
              volume = sum(b["volume"] for b in selected)
              if volume > 0:
                  value = sum(((b["high"] + b["low"] + b["close"]) / 3.0) * b["volume"] for b in selected) / volume
              else:
                  value = sum(b["close"] for b in selected) / len(selected)
              return value, len(selected)

          def aggregate(bars):
              grouped = defaultdict(list)
              for bar in bars:
                  grouped[bar["dt"].date().isoformat()].append(bar)
              rows = []
              for date_key in sorted(grouped):
                  day_bars = sorted(grouped[date_key], key=lambda b: b["dt"])
                  if len(day_bars) < 30:
                      continue
                  w10, n10 = window_value(day_bars, dtime(10, 0), dtime(10, 30))
                  w12, n12 = window_value(day_bars, dtime(12, 0), dtime(12, 30))
                  w14, n14 = window_value(day_bars, dtime(14, 0), dtime(14, 30))
                  if None in (w10, w12, w14):
                      continue
                  first, last = day_bars[0], day_bars[-1]
                  high_bar = max(day_bars, key=lambda b: b["high"])
                  low_bar = min(day_bars, key=lambda b: b["low"])
                  row = {
                      "date": date_key,
                      "bar_count": len(day_bars),
                      "open_time": first["dt"].strftime("%H:%M"),
                      "close_time": last["dt"].strftime("%H:%M"),
                      "open": first["open"],
                      "t10_1030": w10,
                      "t12_1230": w12,
                      "t14_1430": w14,
                      "close": last["close"],
                      "high": high_bar["high"],
                      "high_time": high_bar["dt"].strftime("%H:%M"),
                      "low": low_bar["low"],
                      "low_time": low_bar["dt"].strftime("%H:%M"),
                      "window_counts": [n10, n12, n14],
                  }
                  rows.append(row)
              prev_close = None
              for row in rows:
                  row["intraday_return_pct"] = (row["close"] / row["open"] - 1.0) * 100.0
                  row["t10_return_pct"] = (row["t10_1030"] / row["open"] - 1.0) * 100.0
                  row["t12_return_pct"] = (row["t12_1230"] / row["open"] - 1.0) * 100.0
                  row["t14_return_pct"] = (row["t14_1430"] / row["open"] - 1.0) * 100.0
                  row["gap_return_pct"] = None if prev_close is None else (row["open"] / prev_close - 1.0) * 100.0
                  row["close_to_prev_pct"] = None if prev_close is None else (row["close"] / prev_close - 1.0) * 100.0
                  five = {
                      "시초가": row["open"],
                      "10:00-10:30": row["t10_1030"],
                      "12:00-12:30": row["t12_1230"],
                      "14:00-14:30": row["t14_1430"],
                      "종가": row["close"],
                  }
                  row["five_point_high"] = max(five, key=five.get)
                  row["five_point_low"] = min(five, key=five.get)
                  row["open_is_session_high"] = abs(row["open"] - row["high"]) <= max(1e-9, abs(row["high"]) * 1e-10)
                  prev_close = row["close"]
              return rows

          output = {
              "analysis_period_kst": [START_DATE.isoformat(), END_DATE.isoformat()],
              "bar_interval": "5m",
              "window_definition": "Half-open windows [10:00,10:30), [12:00,12:30), [14:00,14:30), using volume-weighted typical price when volume is available.",
              "assets": {},
              "errors": errors,
              "searches": searches,
          }

          for label, data in raw_assets.items():
              bars = normalize_frame(data["frame"])
              rows = aggregate(bars)
              output["assets"][label] = {
                  "source": "TradingView historical bars via tvDatafeed",
                  "source_symbol": data["chosen"],
                  "session_count": len(rows),
                  "raw_bar_count_in_period": len(bars),
                  "days": rows,
              }

          with open("intraday_result.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2, default=str)

          print("sessions:", {k: v["session_count"] for k, v in output["assets"].items()})
          print("symbols:", {k: v["source_symbol"] for k, v in output["assets"].items()})
          print("errors:", errors)
          print("searches:", searches)
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: july-intraday-result-tv
          path: intraday_result.json
          if-no-files-found: error
          retention-days: 1
