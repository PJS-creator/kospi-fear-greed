name: Temporary July 2026 intraday analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4 lxml

      - name: Fetch and aggregate Naver intraday data
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          import re
          import time
          import urllib.parse
          import urllib.request
          from collections import defaultdict
          from datetime import date, datetime, time as dtime, timedelta
          from bs4 import BeautifulSoup

          START_DATE = date(2026, 7, 1)
          END_DATE = date(2026, 7, 29)
          USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/138 Safari/537.36"
          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "ko-KR,ko;q=0.9,en;q=0.8",
              "Origin": "https://finance.naver.com",
              "Referer": "https://finance.naver.com/",
          }

          def business_dates():
              out = []
              cur = START_DATE
              while cur <= END_DATE:
                  if cur.weekday() < 5:
                      out.append(cur)
                  cur += timedelta(days=1)
              return out

          DATES = business_dates()

          def request_bytes(url, attempts=3, timeout=15):
              last = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers=HEADERS)
                      with urllib.request.urlopen(req, timeout=timeout) as response:
                          return response.read(), dict(response.headers)
                  except Exception as exc:
                      last = f"{type(exc).__name__}: {exc}"
                      time.sleep(0.7 * (attempt + 1))
              raise RuntimeError(f"{last}; url={url}")

          def request_json(url):
              raw, _ = request_bytes(url)
              return json.loads(raw.decode("utf-8"))

          def request_text(url):
              raw, headers = request_bytes(url)
              content_type = str(headers.get("Content-Type", "")).lower()
              for enc in ("euc-kr", "cp949", "utf-8") if "euc" in content_type else ("utf-8", "euc-kr", "cp949"):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      continue
              return raw.decode("utf-8", errors="replace")

          def number(value):
              if value is None:
                  return None
              if isinstance(value, (int, float)):
                  value = float(value)
                  return value if math.isfinite(value) else None
              text = str(value).strip().replace(",", "").replace("+", "")
              text = re.sub(r"[^0-9.\-]", "", text)
              if text in ("", "-", ".", "-."):
                  return None
              try:
                  out = float(text)
              except ValueError:
                  return None
              return out if math.isfinite(out) else None

          def normalize_stock_payload(payload):
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ("chartDomesticList", "data", "result"):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return value
              return []

          def parse_stock_rows(rows):
              bars = []
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  stamp = str(row.get("localDateTime") or row.get("dateTime") or "")
                  try:
                      dt = datetime.strptime(stamp[:14], "%Y%m%d%H%M%S")
                  except ValueError:
                      continue
                  if not (START_DATE <= dt.date() <= END_DATE and dtime(9, 0) <= dt.time() <= dtime(15, 30)):
                      continue
                  o = number(row.get("openPrice"))
                  h = number(row.get("highPrice"))
                  l = number(row.get("lowPrice"))
                  c = number(row.get("currentPrice"))
                  v = number(row.get("accumulatedTradingVolume")) or 0.0
                  if None in (o, h, l, c):
                      continue
                  bars.append({"dt": dt, "open": o, "high": h, "low": l, "close": c, "volume": max(v, 0.0)})
              unique = {}
              for bar in bars:
                  unique[bar["dt"]] = bar
              return sorted(unique.values(), key=lambda x: x["dt"])

          def fetch_stock_bars(code):
              errors = []
              base = f"https://api.stock.naver.com/chart/domestic/item/{code}/minute10"
              month_params = urllib.parse.urlencode({"startDateTime": "202607010900", "endDateTime": "202607291530"})
              try:
                  month_rows = normalize_stock_payload(request_json(f"{base}?{month_params}"))
                  bars = parse_stock_rows(month_rows)
                  if len({b['dt'].date() for b in bars}) >= 15:
                      return bars, errors
                  errors.append(f"monthly response had {len(bars)} bars across {len({b['dt'].date() for b in bars})} dates")
              except Exception as exc:
                  errors.append(f"monthly: {type(exc).__name__}: {exc}")

              all_rows = []
              for d in DATES:
                  ds = d.strftime("%Y%m%d")
                  params = urllib.parse.urlencode({"startDateTime": f"{ds}0900", "endDateTime": f"{ds}1530"})
                  try:
                      all_rows.extend(normalize_stock_payload(request_json(f"{base}?{params}")))
                  except Exception as exc:
                      errors.append(f"{ds}: {type(exc).__name__}: {exc}")
                  time.sleep(0.08)
              return parse_stock_rows(all_rows), errors

          TIME_RE = re.compile(r"^(?:[01]?\d|2[0-3]):[0-5]\d(?::[0-5]\d)?$")

          def parse_index_html(html, day):
              soup = BeautifulSoup(html, "lxml")
              points = []
              for tr in soup.find_all("tr"):
                  cells = [c.get_text(" ", strip=True) for c in tr.find_all("td")]
                  if not cells:
                      continue
                  time_idx = next((i for i, cell in enumerate(cells) if TIME_RE.fullmatch(cell)), None)
                  if time_idx is None:
                      continue
                  value = None
                  for cell in cells[time_idx + 1:]:
                      candidate = number(cell)
                      if candidate is not None and candidate > 0:
                          value = candidate
                          break
                  if value is None:
                      continue
                  t = datetime.strptime(cells[time_idx][:5], "%H:%M").time()
                  points.append({"dt": datetime.combine(day, t), "open": value, "high": value, "low": value, "close": value, "volume": 0.0})
              return points

          def fetch_kospi200_bars():
              all_points = []
              errors = []
              for d in DATES:
                  ds = d.strftime("%Y%m%d")
                  seen_times = set()
                  day_points = []
                  no_new_pages = 0
                  for page in range(1, 9):
                      urls = [
                          f"https://finance.naver.com/sise/sise_index_time.naver?code=KPI200&thistime={ds}153000&page={page}",
                          f"https://finance.naver.com/sise/sise_index_time.nhn?code=KPI200&thistime={ds}153000&page={page}",
                      ]
                      parsed = []
                      page_error = None
                      for url in urls:
                          try:
                              parsed = parse_index_html(request_text(url), d)
                              if parsed:
                                  break
                          except Exception as exc:
                              page_error = f"{type(exc).__name__}: {exc}"
                      new = [p for p in parsed if p["dt"].time() not in seen_times]
                      if new:
                          day_points.extend(new)
                          seen_times.update(p["dt"].time() for p in new)
                          no_new_pages = 0
                      else:
                          no_new_pages += 1
                      if page_error and not parsed:
                          errors.append(f"{ds} page {page}: {page_error}")
                      if (seen_times and min(seen_times) <= dtime(9, 5)) or no_new_pages >= 2:
                          break
                  if day_points:
                      all_points.extend(day_points)
                  time.sleep(0.08)
              unique = {}
              for point in all_points:
                  unique[point["dt"]] = point
              return sorted(unique.values(), key=lambda x: x["dt"]), errors

          def window_value(bars, start_t, end_t, use_vwap):
              selected = [b for b in bars if start_t <= b["dt"].time() < end_t]
              if not selected:
                  return None, 0
              volume = sum(b["volume"] for b in selected)
              if use_vwap and volume > 0:
                  return sum(((b["high"] + b["low"] + b["close"]) / 3.0) * b["volume"] for b in selected) / volume, len(selected)
              return sum(b["close"] for b in selected) / len(selected), len(selected)

          def aggregate(label, bars, use_vwap, sampled_index=False):
              grouped = defaultdict(list)
              for bar in bars:
                  grouped[bar["dt"].date().isoformat()].append(bar)
              rows = []
              for date_key in sorted(grouped):
                  day_bars = sorted(grouped[date_key], key=lambda x: x["dt"])
                  if len(day_bars) < 10:
                      continue
                  w10, n10 = window_value(day_bars, dtime(10, 0), dtime(10, 30), use_vwap)
                  w12, n12 = window_value(day_bars, dtime(12, 0), dtime(12, 30), use_vwap)
                  w14, n14 = window_value(day_bars, dtime(14, 0), dtime(14, 30), use_vwap)
                  if None in (w10, w12, w14):
                      continue
                  first, last = day_bars[0], day_bars[-1]
                  high_bar = max(day_bars, key=lambda x: x["high"])
                  low_bar = min(day_bars, key=lambda x: x["low"])
                  open_value = first["open"] if not sampled_index else first["close"]
                  row = {
                      "date": date_key,
                      "bar_count": len(day_bars),
                      "open_time": first["dt"].strftime("%H:%M"),
                      "close_time": last["dt"].strftime("%H:%M"),
                      "open": open_value,
                      "t10_1030": w10,
                      "t12_1230": w12,
                      "t14_1430": w14,
                      "close": last["close"],
                      "high": high_bar["high"],
                      "high_time": high_bar["dt"].strftime("%H:%M"),
                      "low": low_bar["low"],
                      "low_time": low_bar["dt"].strftime("%H:%M"),
                      "window_counts": [n10, n12, n14],
                      "sampled_index": sampled_index,
                  }
                  rows.append(row)
              prev_close = None
              for row in rows:
                  row["intraday_return_pct"] = (row["close"] / row["open"] - 1.0) * 100.0
                  row["t10_return_pct"] = (row["t10_1030"] / row["open"] - 1.0) * 100.0
                  row["t12_return_pct"] = (row["t12_1230"] / row["open"] - 1.0) * 100.0
                  row["t14_return_pct"] = (row["t14_1430"] / row["open"] - 1.0) * 100.0
                  row["gap_return_pct"] = None if prev_close is None else (row["open"] / prev_close - 1.0) * 100.0
                  row["close_to_prev_pct"] = None if prev_close is None else (row["close"] / prev_close - 1.0) * 100.0
                  five = {
                      "시초가": row["open"],
                      "10:00-10:30": row["t10_1030"],
                      "12:00-12:30": row["t12_1230"],
                      "14:00-14:30": row["t14_1430"],
                      "종가": row["close"],
                  }
                  row["five_point_high"] = max(five, key=five.get)
                  row["five_point_low"] = min(five, key=five.get)
                  row["open_is_session_high"] = abs(row["open"] - row["high"]) <= max(1e-9, abs(row["high"]) * 1e-10)
                  prev_close = row["close"]
              return rows

          output = {
              "analysis_period_kst": [START_DATE.isoformat(), END_DATE.isoformat()],
              "bar_interval": "10m",
              "window_definition": "Half-open windows [10:00,10:30), [12:00,12:30), [14:00,14:30). Stocks use volume-weighted typical price; KOSPI200 uses the mean of sampled index levels.",
              "assets": {},
              "errors": {},
          }

          for label, code in (("삼성전자", "005930"), ("SK하이닉스", "000660"), ("KODEX200_검증용", "069500")):
              bars, errors = fetch_stock_bars(code)
              rows = aggregate(label, bars, use_vwap=True, sampled_index=False)
              output["assets"][label] = {
                  "source": "Naver Finance public 10-minute chart endpoint",
                  "source_code": code,
                  "session_count": len(rows),
                  "days": rows,
              }
              if errors:
                  output["errors"][label] = errors

          index_bars, index_errors = fetch_kospi200_bars()
          index_rows = aggregate("KOSPI200", index_bars, use_vwap=False, sampled_index=True)
          output["assets"]["KOSPI200"] = {
              "source": "Naver Finance KPI200 intraday index table",
              "source_code": "KPI200",
              "session_count": len(index_rows),
              "open_note": "Earliest published intraday index level, normally 09:00-09:01; not an OHLC bar open field.",
              "days": index_rows,
          }
          if index_errors:
              output["errors"]["KOSPI200"] = index_errors

          with open("intraday_result.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print("sessions:", {k: v["session_count"] for k, v in output["assets"].items()})
          print("error_counts:", {k: len(v) for k, v in output["errors"].items()})
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: july-intraday-result
          path: intraday_result.json
          if-no-files-found: error
          retention-days: 1
